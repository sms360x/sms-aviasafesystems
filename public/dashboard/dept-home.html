<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Home - SMS360X</title>
<link rel="stylesheet" href="/css/variables.css?brand=20261028">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --teal: #1E6B52; --teal-dark: #155a43; --neutral: #f4f6f8; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--neutral); }
  .ws-header { background: var(--teal-dark); color: #fff; padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
  .ws-logo { width:48px;height:48px;border-radius:8px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.4rem;color:#fff; }
  .identity h1 { margin:0;font-size:1.5rem;font-weight:700; }
  .identity .dept { margin:.25rem 0 0;font-size:.95rem;opacity:.9; }
  .identity .email { margin:.15rem 0 0;font-size:.85rem;opacity:.8; }
  .logout { background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-size:.9rem; }
  .logout:hover { background:rgba(255,255,255,.25); }
  .ws-main { max-width:960px;margin:2rem auto;padding:0 1rem; }
  .ws-title { font-size:1.1rem;font-weight:600;color:#374151;margin-bottom:1rem; }
  .ws-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:1rem; }
  @media (max-width:640px){ .ws-grid { grid-template-columns:1fr; } }
  .ws-card { background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);border-radius:15px;padding:1.25rem;display:flex;align-items:center;gap:.75rem;text-decoration:none;color:#1f2937;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;box-shadow:0 2px 8px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04); }
  .ws-card:hover { transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);border-color:var(--teal); }
  .ws-card:focus { outline:2px solid var(--teal);outline-offset:2px; }
  .ws-card .icon { width:36px;height:36px;border-radius:8px;background:rgba(30,107,82,.1);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0; }
  .ws-card .name { font-weight:600;font-size:.95rem; }
  @supports not (backdrop-filter:blur(10px)){ .ws-card { background:#fff; } }
</style>
</head>
<body>
<div class="ws-header">
  <div style="display:flex;align-items:center;gap:.85rem;flex:1;min-width:0;">
    <div class="ws-logo" id="wsLogo" aria-label="Airline logo"><i class="fas fa-building" aria-hidden="true"></i></div>
    <div class="identity">
      <h1 id="wsAirline">Loading…</h1>
      <p class="dept" id="wsDept"></p>
      <p class="email" id="wsEmail"></p>
    </div>
  </div>
  <button class="logout" id="wsLogout">Logout</button>
</div>
<div class="ws-main">
  <div style="background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);border-radius:15px;padding:1rem;margin-bottom:1rem;">
    <h2 style="margin:0 0 .5rem;font-size:1rem;color:#374151;">Department CAN/CAP Activity Trend (12 months)</h2>
    <canvas id="trendChart" height="120"></canvas>
    <div id="trendStatus" style="font-size:.85rem;color:#6b7280;margin-top:.5rem;">Loading…</div>
  </div>
  <div class="ws-title">Department Home · Select a module</div>
  <div class="ws-grid">
    <a class="ws-card" href="/dashboard/my-tasks.html"><div class="icon"><i class="fas fa-tasks"></i></div><div class="name">My Tasks</div></a>
    <a class="ws-card" href="/dashboard/master-register.html"><div class="icon"><i class="fas fa-book"></i></div><div class="name">Master Register</div></a>
    <a class="ws-card" href="/can_cap/cans.html"><div class="icon"><i class="fas fa-clipboard-list"></i></div><div class="name">CAN Register</div></a>
    <a class="ws-card" href="/can_cap/caps.html"><div class="icon"><i class="fas fa-check-circle"></i></div><div class="name">CAP Register</div></a>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/js/tenant_context.js"></script>
<script src="/js/firebase.js?v=4.0.1&brand=20261028"></script>
<script>
(function(){
  if (typeof firebase === 'undefined' || !firebase.auth) { window.location.href='/login.html'; return; }
  firebase.auth().onAuthStateChanged(function(user){
    if(!user){ window.location.href='/login.html'; return; }
    user.getIdTokenResult().then(function(tr){
      var claims = tr.claims||{};
      var tenant = claims.tenant_id||'';
      var logoUrl = claims.logo_url || (tenant ? '/assets/airline-logos/'+tenant+'-logo.webp' : null);
      var logoEl = document.getElementById('wsLogo');
      if (logoUrl && logoEl) { var img=new Image(); img.alt='Airline logo'; img.style.width='48px';img.style.height='48px';img.style.borderRadius='8px';img.style.objectFit='contain'; img.onerror=function(){}; img.onload=function(){logoEl.innerHTML='';logoEl.appendChild(img);}; img.src=logoUrl; }
      var airlineName = tenant;
      if (typeof TenantResolver !== 'undefined' && TenantResolver.prettifySlug) airlineName = TenantResolver.prettifySlug(tenant)||airlineName;
      else airlineName = tenant.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
      document.getElementById('wsAirline').textContent = airlineName || 'Workspace';
      var dept = (claims.department||'').replace(/[_-]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
      if (dept && !/Department$/i.test(dept)) dept += ' Department';
      document.getElementById('wsDept').textContent = dept;
      document.getElementById('wsEmail').textContent = user.email||'';
    }).catch(function(){ window.location.href='/login.html'; });
  });
  document.getElementById('wsLogout').addEventListener('click', function(){ if(firebase&&firebase.auth){firebase.auth().signOut().then(function(){window.location.href='/login.html';});}else{window.location.href='/login.html';} });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/feedback.js"></script>
<script>
(function(){
  var statusEl = document.getElementById('trendStatus');
  // Lightweight fetch; backend endpoint may be unavailable yet.
  fetch('/api/can-cap/activity-trend', {credentials:'include'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var months = data.months || [];
    var series = data.series || [];
    var cans = series.map(function(s){return s.cans_issued;});
    var caps = series.map(function(s){return s.caps_submitted;});
    if (window.Chart) {
      new Chart(document.getElementById('trendChart'), {type:'line', data:{labels:months, datasets:[{label:'CANs Issued',data:cans,borderColor:'#1E6B52',fill:false},{label:'CAPs Submitted',data:caps,borderColor:'#2563eb',fill:false}]}, options:{responsive:true}});
    }
    statusEl.textContent = 'Loaded ' + months.length + ' months.';
  }).catch(function(e){
    statusEl.textContent = 'Trend data unavailable: ' + e.message;
  });
})();
</script>
<script>if (typeof initFeedbackWidget === 'function') initFeedbackWidget();</script>
</body>
</html>
