<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Officer — AviaSAFE</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background:#f8fafc; font-family:'Inter',system-ui,sans-serif; color:#0f172a; margin:0; }
    .page { max-width:1100px; margin:0 auto; padding:1.5rem; }
    .card { background:#fff; border-radius:14px; padding:1.4rem; box-shadow:0 1px 6px rgba(0,0,0,0.06); border:1px solid #f1f5f9; margin-bottom:1.25rem; }
    .card h2 { font-size:0.95rem; margin:0 0 1rem; color:#0b2a42; }
    .empty { color:#94a3b8; font-size:0.85rem; padding:1rem 0; text-align:center; }
    .contact { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:0.6rem; margin-top:0.5rem; font-size:0.8rem; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Safety Officer Dashboard</h1>
    <div id="subdomainFlag" data-flag="false"></div>

    <div class="card">
      <h2>Sorting Center (Anonymous VSRs)</h2>
      <div id="sortingCenter" class="empty">Loading…</div>
    </div>

    <div class="card">
      <h2>CAP Queue</h2>
      <div id="capQueue" class="empty">Loading…</div>
    </div>
  </div>

  <script src="/js/safety-officer.js"></script>
</body>
</html>
